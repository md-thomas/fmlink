[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fmlink"
version = "0.1.0"
description = "FMlink digital modem/PHY library: framing, FEC, PSK/QAM modulation, sync"
requires-python = ">=3.9"
dependencies = ["numpy", "scipy"]

[tool.setuptools]
py-modules = [
    "fmlink_modem",
    "fmlink_link",
    "fmlink_pulse",
    "fmlink_channel",
    "fmlink_sync",
    "fmlink_fec",
    "fmlink_audio",
    "fmlink_kiss",
]
